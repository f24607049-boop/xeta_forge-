    <style>
      html {
        scroll-padding-top: 64px; /* Offset for fixed header */
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #090d16; /* Deep Slate/Charcoal base */
        color: #fff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Syncopate', sans-serif;
      }

      /* Glassmorphism Design System */
      .glass-nav {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 100%);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.28),
          0 12px 36px -8px rgba(0, 0, 0, 0.55);
      }

      .glass-panel {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.025) 100%);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.10),
          0 20px 50px -12px rgba(0, 0, 0, 0.6);
      }

      .glass-card {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        backdrop-filter: blur(22px) saturate(170%);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.24),
          inset 1px 0 0 0 rgba(255, 255, 255, 0.10),
          0 14px 36px -6px rgba(0, 0, 0, 0.5);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(6, 182, 212, 0.06) 100%);
        border-color: rgba(103, 232, 249, 0.45);
        box-shadow:
          inset 0 1px 2px 0 rgba(255, 255, 255, 0.38),
          0 18px 44px -8px rgba(6, 182, 212, 0.22);
      }

      .glass-input {
        background: rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .glass-input:focus {
        background: rgba(255, 255, 255, 0.075);
        border-color: rgba(34, 211, 238, 0.6);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.2),
          0 0 20px rgba(6, 182, 212, 0.2);
      }

      .glass-button-primary {
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.75) 0%, rgba(37, 99, 235, 0.65) 100%);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(165, 243, 252, 0.55);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.45),
          0 8px 25px -4px rgba(6, 182, 212, 0.4);
      }

      .glass-button-primary:hover {
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.88) 0%, rgba(59, 130, 246, 0.8) 100%);
        border-color: rgba(207, 250, 254, 0.8);
        box-shadow:
          inset 0 1px 2px 0 rgba(255, 255, 255, 0.6),
          0 12px 32px -4px rgba(6, 182, 212, 0.55);
      }

      .glass-button-secondary {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 100%);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
          0 8px 24px -6px rgba(0, 0, 0, 0.4);
      }

      .glass-button-secondary:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(6, 182, 212, 0.12) 100%);
        border-color: rgba(103, 232, 249, 0.5);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
          0 10px 28px -6px rgba(6, 182, 212, 0.25);
      }
    </style>
